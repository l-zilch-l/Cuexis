          echo "${CMAKE_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/cmake-pinned"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/cmake-pinned" --strip-components=1
          echo "${RUNNER_TEMP}/cmake-pinned/bin" >> "${GITHUB_PATH}"

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcovr

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: g++
          profile: shader-tools-coverage
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: >-
          cmake --preset shader-tools-coverage --fresh
          -DCMAKE_CXX_COMPILER=g++
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset shader-tools-coverage --clean-first

      - name: Test instrumented shader-tools targets
        run: >-
          ctest --preset shader-tools-coverage --no-tests=error
          -E "^cuexis_external_consumer_"

      - name: Capture Task 3 shader-tools coverage evidence
        run: |
          evidence=out/build/shader-tools-coverage/task-3-coverage
          mkdir -p "$evidence"
          {
            printf 'implementation_sha=%s\n' '${{ github.sha }}'
            printf 'preset=shader-tools-coverage\n'
            printf 'compiler='
            g++ --version | head -n 1
            printf 'gcovr='
            gcovr --version | head -n 1
            printf 'root=.\n'
            printf 'filter=engine/shader/src/shader_cache.cpp|engine/shader/src/shader_pipeline_cache.cpp\n'
            printf 'exclude_unreachable_branches=true\n'
            printf 'test_command=ctest --preset shader-tools-coverage --no-tests=error -E ^cuexis_external_consumer_\n'
          } > "$evidence/metadata.txt"
          ctest --preset shader-tools-coverage -N > "$evidence/discovered-tests.txt"
          gcovr out/build/shader-tools-coverage \
            --root . \
            --filter 'engine/shader/src/shader_cache\.cpp' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/shader-cache-branches.txt"
          gcovr out/build/shader-tools-coverage \
            --root . \
            --filter 'engine/shader/src/shader_pipeline_cache\.cpp' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/shader-pipeline-cache-branches.txt"

      - name: Upload Task 3 shader-tools coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-task-3-shader-tools-coverage-${{ github.sha }}
          path: out/build/shader-tools-coverage/task-3-coverage/
          if-no-files-found: warn

  # The declared minimum, exercised on an actual 3.x rather than on whatever the
  # image ships. The parser test needs no configure and no build, so pinning the
  # oldest supported CMake costs one cheap job.
  #
  # It exists because the empty-element detector inside that test cannot bite on
  # CMake 4.x at all: 4.x has no OLD behaviour to select, so the policies are NEW
  # whether or not anything declares them, and a green 4.x run therefore says
  # nothing about 3.x. Running the same test on 3.25.3 is what makes the check
  # mean something.
  parser-lower-bound:
    name: CMake 3.25.3 lower bound (parser only)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake 3.25.3
        run: |
          set -euo pipefail
          archive="cmake-3.25.3-linux-x86_64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/Kitware/CMake/releases/download/v3.25.3/${archive}"
          echo "d4d2ba83301b215857d3b6590cd4434a414fa151c5807693abe587bd6c03581e  /tmp/${archive}" \
            | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/cmake-pinned"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/cmake-pinned" --strip-components=1
          echo "${RUNNER_TEMP}/cmake-pinned/bin" >> "${GITHUB_PATH}"

      - name: Report CMake version
        run: |
          cmake --version
          ctest --version

      - name: Run the parser test on the declared minimum
        run: cmake -P cmake/VerifyReferenceHostCommandParser.cmake

  # The other end of the supported range. The gate itself is exercised here and
  # not only the parser test, because "the policies are all NEW on 4.x" is a
  # reason to expect the gate to behave, not evidence that it does.
  cmake-4-reference:
    name: CMake 4.4.0 reference (gate and parser)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake 4.4.0
        run: |
          set -euo pipefail
          archive="cmake-4.4.0-linux-x86_64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/Kitware/CMake/releases/download/v4.4.0/${archive}"
          echo "3864eb649b4466ae126a64bbde1657adad78efbbaa068bf38201de5cf1b5349f  /tmp/${archive}" \
            | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/cmake-pinned"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/cmake-pinned" --strip-components=1
          echo "${RUNNER_TEMP}/cmake-pinned/bin" >> "${GITHUB_PATH}"

      - name: Report CMake version
        run: |
          cmake --version
          ctest --version

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build clang autoconf autoconf-archive automake libtool libltdl-dev
          python3-venv

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: g++
          profile: headless-release
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: >-
          cmake --preset headless-release --fresh
          -DCMAKE_CXX_COMPILER=g++
          -DCUEXIS_BUILD_DEVELOPER_TOOLS=ON
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset headless-release --clean-first

      - name: Run the reference host gate and the parser test
        run: |
          cmake -P cmake/VerifyReferenceHostCommandParser.cmake
          ctest --preset headless-release --no-tests=error -V \
            -R '^cuexis_reference_host_staging$'
