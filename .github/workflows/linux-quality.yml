name: Linux Quality

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Only GNU gperf/automake assets use the fallback mirror. The pinned port's
  # SHA512 remains mandatory; every other asset uses vcpkg's existing sources.
  X_VCPKG_ASSET_SOURCES: 'x-script,python3 "${{ github.workspace }}/tools/ci/gnu_asset_mirror.py" "{url}" "{sha512}" "{dst}"'
  VCPKG_COMMIT: 40f3c709db80acf154ac4b17a1f83c564ebd022e
  # CMake is pinned instead of taken from the runner image. The image's version
  # changes without notice and this gate is sensitive to which version it is --
  # three defects reached these runners exactly that way, passing on every local
  # and Windows run. 3.28.3 is the version the failures were reproduced with, so
  # the strictest condition is the one under test. The checksum was cross-checked
  # against the SHA-256 file Kitware publishes beside the archive rather than only
  # computed from a local download.
  CMAKE_VERSION: 3.28.3
  CMAKE_SHA256: 804d231460ab3c8b556a42d2660af4ac7a0e21c98a7f8ee3318a74b4a9a187a6

jobs:
  headless-build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC experimental candidate
            preset: candidate-headless-debug
            compiler: g++
            developer_tools: "ON"
          - name: GCC Release
            preset: headless-release
            compiler: g++
            developer_tools: "ON"
          - name: GCC Shared Release
            preset: headless-shared-release
            compiler: g++
            developer_tools: "OFF"
          - name: Clang Shared Debug
            preset: headless-shared-debug
            compiler: clang++
            developer_tools: "ON"
          - name: Clang ASan + UBSan
            preset: headless-sanitize
            compiler: clang++
            developer_tools: "OFF"
          - name: Clang ASan + UBSan shader-tools
            preset: headless-sanitize-shader-tools
            compiler: clang++
            developer_tools: "OFF"
          - name: Clang ASan + UBSan media-tools
            preset: headless-sanitize-media-tools
            compiler: clang++
            developer_tools: "OFF"
          - name: GCC media-tools
            preset: media-tools-coverage
            compiler: g++
            developer_tools: "OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake
        run: |
          set -euo pipefail
          archive="cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${archive}"
          curl -fsSL -o "/tmp/${archive}" "${url}"
          echo "${CMAKE_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/cmake-pinned"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/cmake-pinned" --strip-components=1
          echo "${RUNNER_TEMP}/cmake-pinned/bin" >> "${GITHUB_PATH}"

      - name: Report CMake version
        run: |
          command -v cmake
          command -v ctest
          cmake --version
          ctest --version

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build clang autoconf autoconf-archive automake libtool libltdl-dev
          python3-venv

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: ${{ matrix.compiler }}
          profile: ${{ matrix.preset }}
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }} --fresh
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCUEXIS_BUILD_DEVELOPER_TOOLS=${{ matrix.developer_tools }}
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --clean-first

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # The reference host command gate is run in two passes on purpose. The
          # first pass covers the suite without it, so a failure elsewhere is
          # reported as itself. The second runs that one test verbosely and alone,
          # which is what puts its accounting line -- "expected N, completed N,
          # passed N" -- into the job log. Without it the gate passes silently
          # under ctest's non-verbose default and the counts are never visible in
          # the hosted evidence. --no-tests=error is on both passes so that a gate
          # which stops being registered fails rather than quietly matching
          # nothing. A scripted pass/fail pattern is deliberately not used: the
          # test's own exit status is the criterion.
          ctest --preset ${{ matrix.preset }} --no-tests=error \
            -E '^cuexis_reference_host_staging$'
          ctest --preset ${{ matrix.preset }} --no-tests=error -V \
            -R '^cuexis_reference_host_staging$'

      - name: Capture CFU-F4 sanitizer evidence
        if: matrix.preset == 'headless-sanitize'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p out/build/${{ matrix.preset }}/cfu-f4
          printf 'implementation_sha=%s\n' '${{ github.sha }}' \
            > out/build/${{ matrix.preset }}/cfu-f4/sanitizer.txt
          ctest --preset ${{ matrix.preset }} --no-tests=error \
            -R '^CFU-F4' \
            --output-log out/build/${{ matrix.preset }}/cfu-f4/sanitizer-tests.log

      - name: Capture S5-H shader-tools sanitizer evidence
        if: matrix.preset == 'headless-sanitize-shader-tools'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p out/build/${{ matrix.preset }}/s5-h
          printf 'implementation_sha=%s\n' '${{ github.sha }}' \
            > out/build/${{ matrix.preset }}/s5-h/sanitizer.txt
          ctest --preset ${{ matrix.preset }} --no-tests=error \
            -R 'cuexis_shader|S5-H|s5-h' \
            --output-log out/build/${{ matrix.preset }}/s5-h/sanitizer-tests.log

      - name: Verify CXC tools
        if: matrix.developer_tools == 'ON'
        run: >-
          ctest --preset ${{ matrix.preset }} --no-tests=error
          -R "^cuexis_cxc_tools$"

      - name: Verify CFU-F3 deterministic parity
        if: matrix.developer_tools == 'ON'
        run: >-
          ctest --preset ${{ matrix.preset }} --no-tests=error
          -R "^cuexis_cfu_f3_determinism$"

      - name: Upload CFU-F3 deterministic evidence
        if: always() && matrix.developer_tools == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-cfu-f3-${{ matrix.preset }}-${{ github.sha }}
          path: out/build/${{ matrix.preset }}/cfu-f3/
          if-no-files-found: warn

      - name: Capture CFU-F4 maximum-content performance evidence
        if: matrix.preset == 'headless-release'
        env:
          CUEXIS_RUN_PERFORMANCE_PROBE: 1
        run: >-
          ctest --preset headless-release --no-tests=error -V
          -R '^cuexis_cfu_f4_performance$'

      - name: Capture S5-H max-legal shader performance evidence
        if: matrix.preset == 'headless-release'
        env:
          CUEXIS_RUN_PERFORMANCE_PROBE: 1
        run: >-
          ctest --preset headless-release --no-tests=error -V
          -R '^cuexis_s5h_performance$'

      - name: Upload CFU-F4 safety and performance evidence
        if: >-
          always() &&
          (matrix.preset == 'headless-release' || matrix.preset == 'headless-sanitize')
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-cfu-f4-${{ matrix.preset }}-${{ github.sha }}
          path: out/build/${{ matrix.preset }}/cfu-f4/
          if-no-files-found: warn

      - name: Upload S5-H safety and performance evidence
        if: >-
          always() &&
          (matrix.preset == 'headless-release' ||
           matrix.preset == 'headless-sanitize-shader-tools')
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-s5-h-${{ matrix.preset }}-${{ github.sha }}
          path: out/build/${{ matrix.preset }}/s5-h/
          if-no-files-found: warn

      - name: Verify deterministic performance invariants
        if: matrix.preset == 'headless-release'
        run: >-
          ctest --preset headless-release --no-tests=error
          -R "World transform cache preserves sparse work through the default object budget|PlaybackSession drives a headless owning snapshot"

  documentation-contracts:
    name: Documentation contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build clang autoconf autoconf-archive automake libtool libltdl-dev
          python3-venv

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: g++
          profile: debug
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure documentation target facts
        run: >-
          cmake --preset debug --fresh
          -DCMAKE_CXX_COMPILER=g++
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Check documentation and version contracts
        env:
          CUEXIS_TARGETS_FILE: out/build/debug/generated/cuexis-targets.txt
        run: |
          python3 -B tools/check_docs.py
          python3 -B tools/update_version.py --check
          python3 -B tools/ci/gnu_asset_mirror_tests.py

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: clang++
          profile: headless-clang-tidy
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: >-
          cmake --preset headless-clang-tidy --fresh
          -DCMAKE_CXX_COMPILER=clang++
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Analyze Chart CXC and Playback closures
        run: |
          mkdir -p out/build/headless-clang-tidy/cfu-f4
          printf 'implementation_sha=%s\n' '${{ github.sha }}' \
            > out/build/headless-clang-tidy/cfu-f4/clang-tidy.txt
          cmake --build --preset headless-clang-tidy \
            --target cuexis_chart cuexis_cxc cuexis_playback 2>&1 \
            | tee -a out/build/headless-clang-tidy/cfu-f4/clang-tidy.txt

      - name: Upload CFU-F4 clang-tidy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-cfu-f4-clang-tidy-${{ github.sha }}
          path: out/build/headless-clang-tidy/cfu-f4/
          if-no-files-found: warn

  coverage:
    name: GCC Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake
        run: |
          set -euo pipefail
          archive="cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${archive}"
          curl -fsSL -o "/tmp/${archive}" "${url}"
          echo "${CMAKE_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/cmake-pinned"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/cmake-pinned" --strip-components=1
          echo "${RUNNER_TEMP}/cmake-pinned/bin" >> "${GITHUB_PATH}"

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcovr

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: g++
          profile: headless-coverage
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: >-
          cmake --preset headless-coverage --fresh
          -DCMAKE_CXX_COMPILER=g++
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset headless-coverage --clean-first

      - name: Test instrumented targets
        run: >-
          ctest --preset headless-coverage --no-tests=error
          -E "^cuexis_external_consumer_"

      - name: Enforce coverage baseline
        run: >-
          gcovr out/build/headless-coverage
          --root .
          --filter "engine/"
          --exclude-unreachable-branches
          --print-summary
          --xml coverage.xml
          --fail-under-line 40

      - name: Capture Task 3 core coverage evidence
        run: |
          evidence=out/build/headless-coverage/task-3-coverage
          mkdir -p "$evidence"
          {
            printf 'implementation_sha=%s\n' '${{ github.sha }}'
            printf 'preset=headless-coverage\n'
            printf 'compiler='
            g++ --version | head -n 1
            printf 'gcovr='
            gcovr --version | head -n 1
            printf 'root=.\n'
            printf 'filter=engine/\n'
            printf 'exclude_unreachable_branches=true\n'
            printf 'test_command=ctest --preset headless-coverage --no-tests=error -E ^cuexis_external_consumer_\n'
          } > "$evidence/metadata.txt"
          ctest --preset headless-coverage -N \
            > "$evidence/discovered-tests.txt"
          gcovr out/build/headless-coverage \
            --root . \
            --filter 'engine/' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/engine-summary.txt"
          cp coverage.xml "$evidence/coverage.xml"
          gcovr out/build/headless-coverage \
            --root . \
            --filter 'engine/cxc/' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/cxc-branches.txt"
          gcovr out/build/headless-coverage \
            --root . \
            --filter 'engine/chart/src/(chart_v4_loader|chart_v4_resolver|chart_v4_common_reader_internal|chart_v4_animation_reader_internal|chart_parameter_resolver|prepared_semantic_identity)\.cpp' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/chart-v4-branches.txt"
          gcovr out/build/headless-coverage \
            --root . \
            --filter 'engine/playback/' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/playback-branches.txt"
          gcovr out/build/headless-coverage \
            --root . \
            --filter 'engine/chart/src/prepared_semantic_identity\.cpp' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/prepared-identity-branches.txt"
          gcovr out/build/headless-coverage \
            --root . \
            --filter 'engine/audio/src/audio_transport\.cpp' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/audio-host-clock-branches.txt"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-coverage
          path: coverage.xml

      - name: Upload Task 3 core coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-task-3-core-coverage-${{ github.sha }}
          path: out/build/headless-coverage/task-3-coverage/
          if-no-files-found: warn

  adapter-coverage:
    name: GCC Adapter Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake
        run: |
          set -euo pipefail
          archive="cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${archive}"
          curl -fsSL -o "/tmp/${archive}" "${url}"
          echo "${CMAKE_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/cmake-pinned"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/cmake-pinned" --strip-components=1
          echo "${RUNNER_TEMP}/cmake-pinned/bin" >> "${GITHUB_PATH}"

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build gcovr autoconf autoconf-archive automake libtool libltdl-dev

      - name: Bootstrap pinned vcpkg
        run: |
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics
          printf 'VCPKG_ROOT=%s/.vcpkg\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        uses: ./.github/actions/cache-vcpkg
        with:
          compiler: g++
          profile: adapter-coverage
          vcpkg-commit: ${{ env.VCPKG_COMMIT }}

      - name: Configure
        run: >-
          cmake --preset adapter-coverage --fresh
          -DCMAKE_CXX_COMPILER=g++
          -DCUEXIS_IMPLEMENTATION_SHA=${{ github.sha }}
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build --preset adapter-coverage --clean-first

      - name: Test instrumented adapter targets
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: >-
          ctest --preset adapter-coverage --no-tests=error
          -E "^cuexis_external_consumer_"

      - name: Capture Task 3 adapter coverage evidence
        run: |
          evidence=out/build/adapter-coverage/task-3-coverage
          mkdir -p "$evidence"
          {
            printf 'implementation_sha=%s\n' '${{ github.sha }}'
            printf 'preset=adapter-coverage\n'
            printf 'compiler='
            g++ --version | head -n 1
            printf 'gcovr='
            gcovr --version | head -n 1
            printf 'root=.\n'
            printf 'filter=engine/platform/src/|engine/audio_sdl/src/|engine/render_opengl/src/\n'
            printf 'exclude_unreachable_branches=true\n'
            printf 'test_command=SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=dummy ctest --preset adapter-coverage --no-tests=error -E ^cuexis_external_consumer_\n'
          } > "$evidence/metadata.txt"
          ctest --preset adapter-coverage -N > "$evidence/discovered-tests.txt"
          gcovr out/build/adapter-coverage \
            --root . \
            --filter 'engine/platform/src/' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/platform-sdl-branches.txt"
          gcovr out/build/adapter-coverage \
            --root . \
            --filter 'engine/audio_sdl/src/' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/audio-sdl-branches.txt"
          gcovr out/build/adapter-coverage \
            --root . \
            --filter 'engine/render_opengl/src/' \
            --exclude-unreachable-branches \
            --txt-metric branch \
            --print-summary \
            --txt "$evidence/render-opengl-branches.txt"

      - name: Upload Task 3 adapter coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuexis-task-3-adapter-coverage-${{ github.sha }}
          path: out/build/adapter-coverage/task-3-coverage/
          if-no-files-found: warn

  shader-tools-coverage:
    name: GCC Shader Tools Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake
        run: |
          set -euo pipefail
