name: Version Gate

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full trusted baseline commit SHA for historical revalidation
        required: true
        type: string
      candidate_sha:
        description: Full candidate commit SHA for historical revalidation
        required: true
        type: string
      recorded_utc_date:
        description: Recorded UTC release date for the historical event (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pre-merge:
    name: Version advancement (pre-merge)
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Run trusted version-gate tests and checker
        env:
          CUEXIS_BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CUEXIS_CANDIDATE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          CUEXIS_EVENT: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          CUEXIS_APPROVAL_PR: ${{ github.event.pull_request.number || 0 }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CUEXIS_BASE_SHA}"
          test -n "${CUEXIS_CANDIDATE_SHA}"
          # Fetch data only. Never check out or execute PR code in pull_request_target.
          git fetch --no-tags origin "${CUEXIS_CANDIDATE_SHA}"
          TRUSTED_ROOT="${RUNNER_TEMP}/cuexis-version-gate"
          mkdir -p "${TRUSTED_ROOT}/tools" "${TRUSTED_ROOT}/.github/workflows"
          # The trusted tests build their fixtures by rendering a version file, so
          # the base's own templates for cmake/CuexisVersion.cmake and vcpkg.json
          # must be part of the trusted copy. Taking them from the base keeps the
          # fixture format trusted instead of letting a candidate shape it.
           for path in \
            tools/check_version_gate.py \
            tools/check_version_gate_tests.py \
            tools/update_version.py \
            .github/workflows/version-gate.yml \
            .github/sdk-api-owners.json \
            cmake/CuexisVersion.cmake \
            vcpkg.json; do
            if ! git cat-file -e "${CUEXIS_BASE_SHA}:${path}" 2>/dev/null; then
              echo "::error title=Version gate bootstrap required::version.bootstrap.required: trusted baseline ${CUEXIS_BASE_SHA} lacks ${path}; owner must review the checker and protection rules before the first bootstrap merge. The workflow intentionally fails and never falls back to candidate code."
              exit 1
            fi
            mkdir -p "${TRUSTED_ROOT}/$(dirname "${path}")"
            git show "${CUEXIS_BASE_SHA}:${path}" > "${TRUSTED_ROOT}/${path}"
          done
          export CUEXIS_TRUSTED_ROOT="${TRUSTED_ROOT}"
          python3 -B "${TRUSTED_ROOT}/tools/check_version_gate_tests.py"
          python3 -B "${TRUSTED_ROOT}/tools/check_version_gate.py" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-ref "${CUEXIS_BASE_SHA}" \
            --candidate-ref "${CUEXIS_CANDIDATE_SHA}" \
            --trusted-utc-date "$(date -u +%F)" \
            --context live \
            --event "${CUEXIS_EVENT}" \
            --sdk-owner-approval-pr "${CUEXIS_APPROVAL_PR}"

  post-merge-audit:
    name: Version advancement (post-merge audit)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Run post-merge audit from trusted previous master
        env:
          CUEXIS_BASE_SHA: ${{ github.event.before }}
          CUEXIS_CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${CUEXIS_BASE_SHA}" != "0000000000000000000000000000000000000000"
          TRUSTED_ROOT="${RUNNER_TEMP}/cuexis-version-gate"
          mkdir -p "${TRUSTED_ROOT}/tools" "${TRUSTED_ROOT}/.github/workflows"
          # The trusted tests build their fixtures by rendering a version file, so
          # the base's own templates for cmake/CuexisVersion.cmake and vcpkg.json
          # must be part of the trusted copy. Taking them from the base keeps the
          # fixture format trusted instead of letting a candidate shape it.
           for path in \
            tools/check_version_gate.py \
            tools/check_version_gate_tests.py \
            tools/update_version.py \
            .github/workflows/version-gate.yml \
            .github/sdk-api-owners.json \
            cmake/CuexisVersion.cmake \
            vcpkg.json; do
            if ! git cat-file -e "${CUEXIS_BASE_SHA}:${path}" 2>/dev/null; then
              echo "::error title=Version gate bootstrap required::version.bootstrap.required: trusted baseline ${CUEXIS_BASE_SHA} lacks ${path}; owner must review the checker and protection rules before the first bootstrap merge. The workflow intentionally fails and never falls back to candidate code."
              exit 1
            fi
            mkdir -p "${TRUSTED_ROOT}/$(dirname "${path}")"
            git show "${CUEXIS_BASE_SHA}:${path}" > "${TRUSTED_ROOT}/${path}"
          done
          export CUEXIS_TRUSTED_ROOT="${TRUSTED_ROOT}"
          python3 -B "${TRUSTED_ROOT}/tools/check_version_gate_tests.py"
          python3 -B "${TRUSTED_ROOT}/tools/check_version_gate.py" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-ref "${CUEXIS_BASE_SHA}" \
            --candidate-ref "${CUEXIS_CANDIDATE_SHA}" \
            --trusted-utc-date "$(date -u +%F)" \
            --context live \
            --event push \
            --sdk-owner-approval-pr 0

  historical-revalidation:
    name: Version advancement (historical revalidation)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Run recorded historical context
        env:
          CUEXIS_BASE_SHA: ${{ inputs.base_sha }}
          CUEXIS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CUEXIS_RECORDED_UTC_DATE: ${{ inputs.recorded_utc_date }}
        shell: bash
        run: |
          set -euo pipefail
          TRUSTED_ROOT="${RUNNER_TEMP}/cuexis-version-gate"
          mkdir -p "${TRUSTED_ROOT}/tools" "${TRUSTED_ROOT}/.github/workflows"
          # The trusted tests build their fixtures by rendering a version file, so
          # the base's own templates for cmake/CuexisVersion.cmake and vcpkg.json
          # must be part of the trusted copy. Taking them from the base keeps the
          # fixture format trusted instead of letting a candidate shape it.
           for path in \
            tools/check_version_gate.py \
            tools/check_version_gate_tests.py \
            tools/update_version.py \
            .github/workflows/version-gate.yml \
            .github/sdk-api-owners.json \
            cmake/CuexisVersion.cmake \
            vcpkg.json; do
            if ! git cat-file -e "${CUEXIS_BASE_SHA}:${path}" 2>/dev/null; then
              echo "::error title=Version gate bootstrap required::version.bootstrap.required: trusted baseline ${CUEXIS_BASE_SHA} lacks ${path}; owner must review the checker and protection rules before the first bootstrap merge. The workflow intentionally fails and never falls back to candidate code."
              exit 1
            fi
            mkdir -p "${TRUSTED_ROOT}/$(dirname "${path}")"
            git show "${CUEXIS_BASE_SHA}:${path}" > "${TRUSTED_ROOT}/${path}"
          done
          export CUEXIS_TRUSTED_ROOT="${TRUSTED_ROOT}"
          python3 -B "${TRUSTED_ROOT}/tools/check_version_gate_tests.py"
          python3 -B "${TRUSTED_ROOT}/tools/check_version_gate.py" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --base-ref "${CUEXIS_BASE_SHA}" \
            --candidate-ref "${CUEXIS_CANDIDATE_SHA}" \
            --trusted-utc-date "${CUEXIS_RECORDED_UTC_DATE}" \
            --context historical \
            --event workflow_dispatch
