name: Windows MSVC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Select hosted vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not set on the hosted runner"
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} --fresh

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --clean-first

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error

      - name: Verify architecture
        run: >-
          ctest --preset ${{ matrix.preset }} --no-tests=error
          -R "^cuexis_architecture_tests$"

      - name: Check formatting
        if: matrix.preset == 'debug'
        run: cmake --build --preset debug --target cuexis_format_check
