name: Windows MSVC

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT: 40f3c709db80acf154ac4b17a1f83c564ebd022e

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\.vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} --fresh

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --clean-first

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error

      - name: Verify architecture
        run: >-
          ctest --preset ${{ matrix.preset }} --no-tests=error
          -R "^cuexis_architecture_tests$"

      - name: Check formatting
        if: matrix.preset == 'debug'
        run: cmake --build --preset debug --target cuexis_format_check
